name = "linework-barcode-scanner"
compatibility_date = "2026-10-19"
main = "src/worker.js"
workers_dev = true

[[routes]]
pattern = "linework.stucovitv.in"
custom_domain = true

# Static assets produced by `npm run build`. Caching and security headers live in public/_headers.
# The Worker runs first so it can answer /api requests and redirect the legacy hostname.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# Events, teams, alerts, push subscriptions, and the spreadsheet change log.
[[d1_databases]]
binding = "DB"
database_name = "linework"
database_id = "41d18bb4-1e92-4779-afc6-f2c05cdcc5ca"
migrations_dir = "migrations"

# Public values only. The VAPID private key (and, optionally, EXPO_ACCESS_TOKEN) are secrets:
#   npx wrangler secret put VAPID_PRIVATE_KEY      (production)
#   .dev.vars, written by scripts/generate-vapid-keys.mjs   (local development)
[vars]
# Sign-in tokens must be issued to this OAuth client; it matches VITE_GOOGLE_CLIENT_ID.
GOOGLE_CLIENT_ID = "1045236525603-6r4t47890f4140119g8bd2729277ube6.apps.googleusercontent.com"
# The mobile app's iOS and Android OAuth clients, comma-separated (see app/README.md).
GOOGLE_CLIENT_IDS = "1045236525603-lvk42rc1l06ptkr5b2nlsiug4oqm1300.apps.googleusercontent.com,1045236525603-cens69fiqfuqus7qtqpbei5eppju18df.apps.googleusercontent.com"
# Browser origins allowed to make changes through the API (checked against the Origin header).
# localhost:8081 is the mobile app's web build in development.
APP_ORIGINS = "https://linework.stucovitv.in,http://localhost:3000,http://localhost:8081"
VAPID_PUBLIC_KEY = "BB9Mzv2uY1v-2L0kn1eM9-vC85tQeQywUxnWZUV5Fq6Rt0fXD1YMsrfuShUUMzlhIARO13UcBnag80ndsPiP7bA"
VAPID_SUBJECT = "https://linework.stucovitv.in"
